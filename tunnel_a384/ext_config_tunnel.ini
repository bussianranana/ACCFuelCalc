; Custom Shaders Patch snippet for the A-384 tunnel string object.
; Paste into extension/ext_config.ini of the track (or your track's config in
; content/tracks/<track>/extension/ext_config.ini). Treat the values as a
; starting point and tune them in-game with the CSP Objects Inspector.

; Lamp lenses stay lit day and night (tunnel lighting is always on).
[MATERIAL_ADJUSTMENT_TUNNEL_LENS]
MATERIALS = tunnel_lamp_lens
KEY_0 = ksEmissive
VALUE_0 = 30, 26, 18

; One spot light per lens mesh (tunnel_light_lens_L01..L08, R01..R08),
; aimed along the lens normal toward the carriageway.
[LIGHT_SERIES_TUNNEL]
MATERIALS = tunnel_lamp_lens
DIRECTION = NORMAL
OFFSET = 0, 0, 0
SPOT = 150
SPOT_SHARPNESS = 0.3
RANGE = 14
RANGE_GRADIENT_OFFSET = 0.2
COLOR = 255, 214, 160, 4
SPECULAR_MULT = 0.5
FADE_AT = 500
FADE_SMOOTH = 100
CLUSTER_THRESHOLD = 20
