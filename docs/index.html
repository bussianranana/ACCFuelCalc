<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RaceSim Fuel Calculator — Legal</title>
  <style>
    :root {
      --bg: #0f1419;
      --text: #e7ecf1;
      --muted: #9aa8b5;
      --card: #172231;
      --line: #243041;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1a2a3d 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 4rem 1.25rem;
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    .lead { color: var(--muted); margin-bottom: 2rem; }
    .links {
      display: grid;
      gap: 0.85rem;
    }
    a.card {
      display: block;
      padding: 1rem 1.15rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-family: system-ui, sans-serif;
      font-weight: 600;
    }
    a.card span {
      display: block;
      margin-top: 0.25rem;
      color: var(--muted);
      font-weight: 400;
      font-size: 0.92rem;
    }
    a.card:hover { border-color: #2b6cb0; }
  </style>
</head>
<body>
  <main>
    <h1>RaceSim Fuel Calculator</h1>
    <p class="lead">Legal pages for the Discord fuel calculator bot.</p>
    <div class="links">
      <a class="card" href="terms.html">
        Terms of Service
        <span>Rules for using the bot</span>
      </a>
      <a class="card" href="privacy.html">
        Privacy Policy
        <span>What data we process and why</span>
      </a>
    </div>
  </main>
</body>
</html>
